# Block IDs read by the shaders through mc_Entity.x (terrain) and blockEntityId (block entities).
# Keep in sync with shaders/lib/materials/blockIds.glsl.
#
# Ranges
#   10xx  plants and foliage (waving + foliage shading)
#   20xx  light sources (emissive; the id picks the light colour)
#   30xx  translucents
#   40xx  shape flags (no special shading)
#   50xx  materials (smoothness, metals); 51xx ores
#   90xx  block entities with special rendering
# Unlisted blocks get -1 and use the default material.
#
# Modded blocks: add their ids to the matching line. Lines that include %tags
# (Iris 1.8+) also pick up modded blocks carrying the same tag; explicit names win
# over tags. One line per id: a repeated key would replace the earlier line.

# ---- Plants ---------------------------------------------------------------------
