# Block IDs read by the shaders through mc_Entity.x (terrain) and blockEntityId (block entities).
# Keep in sync with shaders/lib/materials/blockIds.glsl.
#
# Ranges
#   10xx  plants and foliage (waving + foliage shading)
#   20xx  light sources (emissive; the id picks the light colour)
#   30xx  translucents
#   90xx  block entities with special rendering
# Unlisted blocks get -1 and use the default material.
#
# Modded blocks: add their ids to the matching line. Lines that include %tags
# (Iris 1.8+) also pick up modded blocks carrying the same tag; explicit names win
# over tags. One line per id: a repeated key would replace the earlier line.

# ---- Plants ---------------------------------------------------------------------
# Single-block plants rooted at the bottom (top vertices wave)
block.1001 = %minecraft:small_flowers %minecraft:saplings %minecraft:crops short_grass fern dead_bush bush short_dry_grass tall_dry_grass dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower closed_eyeblossom open_eyeblossom cactus_flower firefly_bush oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling cherry_sapling pale_oak_sapling mangrove_propagule wheat carrots potatoes beetroots torchflower_crop sweet_berry_bush nether_wart melon_stem pumpkin_stem attached_melon_stem attached_pumpkin_stem crimson_roots warped_roots nether_sprouts crimson_fungus warped_fungus brown_mushroom red_mushroom
# Two-block plants, lower half (sways less)
