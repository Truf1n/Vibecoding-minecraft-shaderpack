# ---- Shape flags ----------------------------------------------------------------
# Partial blocks that can hold water but currently don't. Underwater, a water surface
# right under one of these stays a real surface (there is air between them).
block.4001 = %minecraft:stairs:waterlogged=false %minecraft:slabs:type=bottom:waterlogged=false %minecraft:slabs:type=top:waterlogged=false %minecraft:trapdoors:waterlogged=false %minecraft:fences:waterlogged=false %minecraft:walls:waterlogged=false

# ---- Render layers ----------------------------------------------------------------
# Plain glass is drawn like stained glass (translucent pass, clean tint) instead of as a
# cutout: the same look, and the water and lighting code see all glass the same way.
layer.translucent = glass glass_pane

