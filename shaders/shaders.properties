# ---- Pipeline -------------------------------------------------------------------
oldLighting = false
oldHandLight = false
separateAo = true
underwaterOverlay = false
vignette = false
# All particles render after the deferred pass, forward-lit.
particles.ordering = after
# The sky (including stars) is drawn procedurally in the deferred pass.
sky = false
stars = false
# Shadows: separate hardware-compare samplers (shadowtex*HW) keep raw depth readable too.
iris.features.required = SEPARATE_HARDWARE_SAMPLERS CUSTOM_IMAGES COMPUTE_SHADERS BLOCK_EMISSION_ATTRIBUTE SSBO

# Column maps (lib/materials/columnMaps.glsl): 512x512 block columns x 128 levels around
# the camera height as bits (4 words per column), cleared every frame and refilled by the
# shadow pass. 4 MB each.
image.ceilingImg = ceilingSampler red_integer r32ui unsigned_int true false 512 2048
image.glassCeilingImg = glassCeilingSampler red_integer r32ui unsigned_int true false 512 2048
image.glassCellsImg = glassCellsSampler red_integer r32ui unsigned_int true false 512 2048
image.waterCellsImg = waterCellsSampler red_integer r32ui unsigned_int true false 512 2048
image.waterSurfacesImg = waterSurfacesSampler red_integer r32ui unsigned_int true false 512 2048
iris.features.optional = ENTITY_TRANSLUCENT
shadowTranslucent = true
shadowBlockEntities = false
#ifdef ENTITY_SHADOWS
shadowEntities = true
#else
shadowEntities = false
#endif
# The player's own shadow (also when entity shadows are off; turned off in the shadow pass).
#ifdef PLAYER_SHADOW
shadowPlayer = true
#else
shadowPlayer = false
#endif

# TAA resolve pass is skipped entirely when the option is off.
#ifndef TAA
program.world0/composite3.enabled = false
program.world-1/composite3.enabled = false
program.world1/composite3.enabled = false
#endif

# Bloom: tiles of the blurred scene in a half-size buffer (composite4), added in the post
# pass (composite5).
size.buffer.colortex13 = 0.5 0.5
#ifndef BLOOM
program.world0/composite4.enabled = false
program.world-1/composite4.enabled = false
program.world1/composite4.enabled = false
#endif

# Volumetric clouds: the cloud pass (deferred) renders into buffers allocated at the
# reduced size (no wasted full-screen memory). Clouds and light shafts exist only in the
# Overworld (tools/gen_wrappers.py leaves the passes out elsewhere).
#if CLOUD_RES_DIV == 4
size.buffer.colortex9 = 0.25 0.25
size.buffer.colortex10 = 0.25 0.25
#endif
#if CLOUD_RES_DIV == 2
size.buffer.colortex9 = 0.5 0.5
size.buffer.colortex10 = 0.5 0.5
#endif
#if CLOUD_STYLE != 1
program.world0/deferred.enabled = false
#endif
#if CLOUD_STYLE != 2
clouds = off
#endif

# Light shafts: marched into a half-size buffer (composite1), added at full size (composite2).
size.buffer.colortex11 = 0.5 0.5
#if VL_QUALITY == 0
program.world0/composite1.enabled = false
program.world0/composite2.enabled = false
#endif

# ---- Block reflections ------------------------------------------------------------
# deferred3 traces them (into colortex12, half size by default), deferred4 adds them.
#if REFLECTION_RES == 2
size.buffer.colortex12 = 0.5 0.5
#endif
#if BLOCK_REFLECTIONS != 2
program.world0/deferred3.enabled = false
program.world0/deferred4.enabled = false
program.world-1/deferred3.enabled = false
program.world-1/deferred4.enabled = false
program.world1/deferred3.enabled = false
program.world1/deferred4.enabled = false
#endif

# ---- Ambient occlusion ------------------------------------------------------------
# deferred1 computes it at half size (colortex15); the lighting pass (deferred2) upsamples it.
size.buffer.colortex15 = 0.5 0.5
#if SSAO == 0
program.world0/deferred1.enabled = false
program.world-1/deferred1.enabled = false
program.world1/deferred1.enabled = false
#endif

# ---- Interactive ripples ----------------------------------------------------------
# 256x256 quarter-block cells around the player (lib/materials/ripples.glsl): the shadow
# pass records entities' heights per cell, shadowcomp1 steps the wave simulation (two
# halves of rippleImg take turns).
#ifdef INTERACTIVE_RIPPLES
image.rippleImg = rippleSampler rg rg16f half_float false false 256 512
image.rippleLowImg = rippleLowSampler red_integer r32ui unsigned_int true false 256 256
image.rippleHighImg = rippleHighSampler red_integer r32ui unsigned_int true false 256 256
#else
program.world0/shadowcomp1.enabled = false
program.world1/shadowcomp1.enabled = false
#endif

# ---- Coloured lighting ------------------------------------------------------------
# The shadow pass fills the voxel volume (lib/lighting/voxels.glsl), shadowcomp floodfills
# it into two volumes that take turns. Invisible light blocks are drawn into the shadow
# pass so they count as sources. 256x128x256: 32 MB voxels + 2 x 32 MB light.
#ifdef COLORED_LIGHTING
voxelizeLightBlocks = true
#if COLORED_LIGHT_RANGE == 2
image.voxelImg = voxelSampler red_integer r32ui unsigned_int true false 256 128 256
image.floodImgA = floodSamplerA rgb r11f_g11f_b10f float false false 256 128 256
image.floodImgB = floodSamplerB rgb r11f_g11f_b10f float false false 256 128 256
#else
image.voxelImg = voxelSampler red_integer r32ui unsigned_int true false 128 64 128
image.floodImgA = floodSamplerA rgb r11f_g11f_b10f float false false 128 64 128
image.floodImgB = floodSamplerB rgb r11f_g11f_b10f float false false 128 64 128
#endif
#else
program.world0/shadowcomp.enabled = false
program.world-1/shadowcomp.enabled = false
program.world1/shadowcomp.enabled = false
# The Nether's shadow pass exists only to fill the voxels.
program.world-1/shadow.enabled = false
#endif

# ---- Custom uniforms -------------------------------------------------------------
# 1 when the camera is underground: little sky light reaching the eye and below sea level.
variable.float.caveRaw = (1.0 - eyeBrightnessSmooth.y / 240.0) * clamp((62.0 - cameraPosition.y) / 16.0, 0.0, 1.0)
uniform.float.caveFactor = smooth(caveRaw, 3, 3)

# Weather:
# and how snowy / sandy the biome is (snowstorms, sandstorms, no puddles).
# (Slowly smoothed rain and thunder now live in the world state: lib/world/worldState.glsl.)
# How windy the biome is (world state wind speed).
uniform.float.biomeWindiness = smooth(if(in(biome_category, CAT_PLAINS, CAT_OCEAN, CAT_BEACH, CAT_DESERT, CAT_MESA, CAT_SAVANNA, CAT_ICY, CAT_EXTREME_HILLS, CAT_MOUNTAIN), 1.35, if(in(biome_category, CAT_JUNGLE, CAT_FOREST, CAT_TAIGA, CAT_SWAMP, CAT_MUSHROOM), 0.7, 1.0)), 10, 10)

# ---- World state ------------------------------------------------------------------
# One shared storage buffer (lib/world/worldState.glsl), written by begin.csh each frame.
bufferObject.0 = 256

# Water looks per biome (lib/materials/waterStyles.glsl), for the water the camera is in
# and for default-coloured water.
uniform.float.watSwamp = smooth(if(in(biome, BIOME_SWAMP), 1, 0), 4, 4)
uniform.float.watMangrove = smooth(if(in(biome, BIOME_MANGROVE_SWAMP), 1, 0), 4, 4)
uniform.float.watWarm = smooth(if(in(biome, BIOME_WARM_OCEAN), 1, 0), 4, 4)
uniform.float.watLukewarm = smooth(if(in(biome, BIOME_LUKEWARM_OCEAN, BIOME_DEEP_LUKEWARM_OCEAN), 1, 0), 4, 4)
uniform.float.watCold = smooth(if(in(biome, BIOME_COLD_OCEAN, BIOME_DEEP_COLD_OCEAN, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN, BIOME_FROZEN_RIVER, BIOME_SNOWY_TAIGA, BIOME_SNOWY_BEACH), 1, 0), 4, 4)
uniform.float.watMeadow = smooth(if(in(biome, BIOME_MEADOW), 1, 0), 4, 4)
uniform.float.watCherry = smooth(if(in(biome, BIOME_CHERRY_GROVE), 1, 0), 4, 4)
uniform.float.watPale = smooth(if(in(biome, BIOME_PALE_GARDEN), 1, 0), 4, 4)
uniform.float.watDesert = smooth(if(in(biome, BIOME_DESERT), 1, 0), 4, 4)
uniform.float.watBadlands = smooth(if(in(biome, BIOME_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_WOODED_BADLANDS), 1, 0), 4, 4)
uniform.float.watJungle = smooth(if(in(biome, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE, BIOME_BAMBOO_JUNGLE), 1, 0), 4, 4)
uniform.float.watMushroom = smooth(if(in(biome, BIOME_MUSHROOM_FIELDS), 1, 0), 4, 4)
uniform.float.inSnowyBiome = smooth(if(biome_precipitation == PPT_SNOW, 1, 0), 8, 8)
uniform.float.inSandyBiome = smooth(if(in(biome_category, CAT_DESERT, CAT_MESA), 1, 0), 8, 8)

# Nether biome weights, faded over a few seconds, for per-biome fog and ambient colours.
uniform.float.inNetherWastes = smooth(if(in(biome, BIOME_NETHER_WASTES), 1, 0), 6, 6)
uniform.float.inCrimsonForest = smooth(if(in(biome, BIOME_CRIMSON_FOREST), 1, 0), 6, 6)
uniform.float.inWarpedForest = smooth(if(in(biome, BIOME_WARPED_FOREST), 1, 0), 6, 6)
uniform.float.inBasaltDeltas = smooth(if(in(biome, BIOME_BASALT_DELTAS), 1, 0), 6, 6)
uniform.float.inSoulValley = smooth(if(in(biome, BIOME_SOUL_SAND_VALLEY), 1, 0), 6, 6)

# ---- Blending -------------------------------------------------------------------
# Shadow pass: the nearest caster alone decides the tint and water mask (no blending, so
# the result does not depend on the order Sodium sorts translucent geometry in).
blend.shadow = off
# G-buffer writers must never blend: blended normals/material ids are meaningless.
blend.gbuffers_terrain = off
blend.gbuffers_entities = off
blend.gbuffers_block = off
blend.gbuffers_hand = off

# Overlay layer (colortex4) is premultiplied alpha: clouds blend, emissives add (alpha 0).
blend.gbuffers_clouds = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_lightning = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Cracks multiply the scene colour and the albedo (vanilla blend); AO in albedo alpha is kept.
blend.gbuffers_damagedblock = DST_COLOR SRC_COLOR ZERO ONE

# Unlit lines/leads write the "keep" shading model unblended.
blend.gbuffers_basic.colortex3 = off
blend.gbuffers_line.colortex3 = off
blend.gbuffers_textured.colortex3 = off

# Translucent terrain alpha-blends into colortex0 (vanilla blend); its tint multiplies colortex5.
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex5 = DST_COLOR ZERO DST_ALPHA ZERO
blend.gbuffers_hand_water.colortex5 = DST_COLOR ZERO DST_ALPHA ZERO
# Translucent mobs: order-independent layers (transmittance multiplies, light adds).
blend.gbuffers_entities_translucent.colortex5 = DST_COLOR ZERO ZERO ONE
blend.gbuffers_entities_translucent.colortex6 = ONE ONE ONE ONE
blend.gbuffers_block_translucent.colortex5 = DST_COLOR ZERO ZERO ONE
blend.gbuffers_block_translucent.colortex6 = ONE ONE ONE ONE
# Their solid texels replace the scene (alpha 1) and mark the pixel "keep"; see-through
# texels leave both alone (alpha 0).
blend.gbuffers_entities_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_entities_translucent.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_block_translucent.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_block_translucent.colortex3 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
